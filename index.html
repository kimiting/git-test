<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ランダムチーム分け</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>ランダムチーム分け</h1>

      <div class="panel">
        <label for="names">参加者の名前</label>
        <textarea id="names" rows="12" placeholder="例：&#10;田中&#10;山田&#10;佐藤&#10;鈴木"></textarea>

        <div class="row">
          <label for="teamSize">1チームの人数</label>
          <input id="teamSize" type="number" min="1" value="3" />
        </div>

        <button id="shuffleBtn">チーム分けする</button>
      </div>

      <div class="result-box">
        <h2>結果</h2>
        <div id="result"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
